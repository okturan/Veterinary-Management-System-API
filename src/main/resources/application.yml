spring:
  application:
    name: "Veterinary"

  datasource:
    url: ${VET_DB_URL}
    username: ${VET_DB_USER}
    password: ${VET_DB_PASSWORD}
    driverClassName: ${VET_DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${VET_DDL_AUTO:validate}

vet:
  seed-demo-data: ${VET_SEED_DEMO_DATA:false}
